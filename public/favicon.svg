<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F1D8" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <!-- Obsidian dark base -->
  <rect width="32" height="32" rx="8" fill="#09090B" />
  <!-- Subtle gold frame outline -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.75" />
  <!-- Elegant Serif Letter B for Bojor Gallery -->
  <text x="16" y="21.5" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-weight="600" font-size="20" fill="url(#goldGrad)">B</text>
</svg>
